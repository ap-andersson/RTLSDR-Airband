name: Fork image

# This fork's container image: AM-only (NFM=FALSE, 8 kHz audio) for amd64 and arm64, published
# to ghcr.io/<owner>/rtlsdr-airband as :latest from main and :sha-<commit> for every build.
# The unit tests run inside the Docker build. Pull requests build and smoke test without pushing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        id: prep
        run: |
          echo "platform_pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rtlsdr-airband" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the version comes from git describe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: steps.prep.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: NFM=FALSE
          cache-from: type=gha,scope=fork-${{ steps.prep.outputs.platform_pair }}
          cache-to: type=gha,mode=max,scope=fork-${{ steps.prep.outputs.platform_pair }}
          load: ${{ steps.prep.outputs.push != 'true' }}
          tags: ${{ steps.prep.outputs.push != 'true' && 'rtlsdr-airband:ci' || '' }}
          outputs: ${{ steps.prep.outputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.prep.outputs.image) || '' }}

      - name: Smoke test image
        env:
          image: ${{ steps.prep.outputs.push == 'true' && format('{0}@{1}', steps.prep.outputs.image, steps.build.outputs.digest) || 'rtlsdr-airband:ci' }}
          pull: ${{ steps.prep.outputs.push == 'true' && '--pull=always' || '--pull=never' }}
        run: docker run --rm "$pull" --entrypoint /app/rtl_airband "$image" -v

      - name: Export digest
        if: steps.prep.outputs.push == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.prep.outputs.push == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.prep.outputs.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        id: prep
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rtlsdr-airband" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.prep.outputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.prep.outputs.image }}:${{ steps.metadata.outputs.version }}
